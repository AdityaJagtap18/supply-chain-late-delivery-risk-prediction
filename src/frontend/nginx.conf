server {
    listen 4200;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: Angular's router handles paths like /orders/4 client-side; nginx must serve
    # index.html for any path that isn't a real static file, or a direct navigation/reload 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
